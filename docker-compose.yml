version: '3.8'

services:
  # Server - Fastify + SQLite + Socket.io
  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    ports:
      - "4000:4000"
    volumes:
      - server-data:/app/data
      - uploads:/app/uploads
    environment:
      - PORT=4000
      - JWT_SECRET=escape-room-secret-key-change-in-production
      - DATABASE_PATH=/app/data/db.sqlite
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Studio - Vite dev/build served by nginx
  studio:
    build:
      context: .
      dockerfile: Dockerfile.studio
    ports:
      - "3001:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://server:4000

  # Player - Vite dev/build served by nginx
  player:
    build:
      context: .
      dockerfile: Dockerfile.player
    ports:
      - "3002:80"
    depends_on:
      server:
        condition: service_healthy
    environment:
      - VITE_API_URL=http://server:4000
      - VITE_WS_URL=ws://server:4000

volumes:
  server-data:
  uploads:
